name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build single-file exe
        run: pyinstaller --noconsole --onefile --noupx --clean --name DeltaBattery delta2_battery.py

      - name: Stash single-file exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\DeltaBattery.exe release\DeltaBattery.exe

      - name: Build folder version
        run: |
          rmdir /s /q build dist
          pyinstaller --noconsole --onedir --noupx --clean --name DeltaBattery delta2_battery.py
        shell: cmd

      - name: Zip folder version
        shell: pwsh
        run: Compress-Archive -Path dist\DeltaBattery -DestinationPath release\DeltaBattery-folder.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DeltaBattery
          path: release/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
